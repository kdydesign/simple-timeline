name: Application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  app:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run verify:app
      - if: runner.os == 'Windows'
        run: npm run verify:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/app/
            artifacts/native/
            artifacts/e2e/
          if-no-files-found: error
