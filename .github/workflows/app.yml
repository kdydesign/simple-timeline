name: Application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  app:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - name: Prepare Electron sandbox on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run verify:app
      - if: runner.os == 'Windows'
        run: npm run verify:app
      - name: Build unsigned current-user Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Build a synthetic next-version installer for update verification
        if: runner.os == 'Windows'
        run: npm run dist:win:test-update
      - name: Verify production package and actual NSIS lifecycle on the disposable VM
        if: runner.os == 'Windows'
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: SimpleTimeline-Windows11-x64-unsigned-${{ github.sha }}
          path: |
            release/*.exe
            release/*.sha256
            release/release-manifest.json
            release/USER-GUIDE.ko.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/app/
            artifacts/native/
            artifacts/e2e/
            artifacts/packaged/
          if-no-files-found: error
