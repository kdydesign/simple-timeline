name: Repository harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/harness/check.mjs
      - run: node --test scripts/harness/check.test.mjs
      - run: git log -1 -m --check --format= HEAD
