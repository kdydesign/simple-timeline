appId: com.kdydesign.simpletimeline
productName: Planrail
directories:
  output: release
files:
  - out/**/*
  - resources/icon.png
  - resources/icon.ico
  - resources/licenses/**/*
  - package.json
extraResources:
  - from: resources/windows/login-startup.ps1
    to: windows/login-startup.ps1
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*.node
npmRebuild: true
forceCodeSigning: false
publish:
  provider: generic
  url: http://127.0.0.1:9/planrail-feed-disabled/
artifactName: Planrail-${version}-win-${arch}-${env.ST_SOURCE_SHA}.${ext}
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  executableName: Planrail
  requestedExecutionLevel: asInvoker
  signExecutable: false
nsis:
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  oneClick: false
  include: scripts/release/installer.nsh
  perMachine: false
  allowElevation: false
  installerLanguages: [ko_KR]
  language: "1042"
  deleteAppDataOnUninstall: false
  packElevateHelper: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
