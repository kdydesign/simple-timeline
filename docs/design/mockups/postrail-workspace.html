<style>
:root{color-scheme:dark;font:14px/1.55 "Segoe UI","Noto Sans CJK KR",sans-serif;color:#eef2f5;--line:#46515a;--sub:#b2bec8;--sky:#a7d8f5;--green:#98d4ad;--amber:#eac191;--surface:linear-gradient(115deg,#2a3036ed,#272c32ed);--mono:Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 100% 100%,#383140,transparent 52%),linear-gradient(120deg,#222b2f,#202327);min-height:100vh}button,input,select,textarea{font:inherit;color:inherit}button,select,input{border:1px solid var(--line);border-radius:6px;background:#232a30;padding:6px 10px}button,select{cursor:pointer}button{background:linear-gradient(#3a434b,#30373d)}button:hover{border-color:#788d9c}button:disabled{opacity:.55;cursor:default}button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--sky);outline-offset:2px}h1,h2,h3,p,pre{margin:0}h1{font-size:21px;letter-spacing:-.6px}h2{font-size:16px}h3{font-size:14px}small,.sub{color:var(--sub)}small{font-size:12px}[hidden]{display:none!important}.row,.brand,nav,.item,.folder summary,.title,.foot,.endpoint,.tabs,.meta,.tools{display:flex;align-items:center;gap:9px}.apart{justify-content:space-between}.auto{margin-left:auto}.brand{padding:9px 16px;font-size:16px;font-weight:700}.brand img{width:24px;height:24px}.demo{font-size:12px;color:var(--sub);font-weight:400}header{background:linear-gradient(110deg,#29323a,#2c2c33);border-bottom:1px solid var(--line)}nav{padding:1px 14px 9px;gap:5px;overflow:auto}nav button{border:1px solid transparent;background:none;min-width:105px;min-height:36px;white-space:nowrap}nav button:disabled{opacity:.84}nav button.active,.primary{background:linear-gradient(#405c73,#304659);border:1px solid #79afd1;color:#eff9ff}.mark{color:var(--sky);font-size:18px;padding-right:6px}main{padding:14px;max-width:1620px;margin:auto}#post{display:grid;grid-template-columns:235px minmax(0,1fr);gap:14px;min-height:calc(100vh - 143px)}aside,.panel,dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 4px 18px #0002}aside{align-self:start;padding:14px 11px}.env{width:100%;margin:8px 0 15px}.asidehead{border-top:1px solid var(--line);padding-top:14px;margin-bottom:8px}.ghost,.more{background:transparent;border-color:transparent;color:var(--sub);padding:3px 5px}.ghost{color:var(--sky);font-size:12px}.folder{border-top:1px solid #3b444d}.folder summary{padding:9px 1px;cursor:pointer;list-style:none;font-size:13px;font-weight:650}.folder summary:before{content:'▸';color:var(--sub)}.folder[open]>summary:before{content:'▾'}.folder summary small{font-weight:400}.item{padding:2px 3px;border:1px solid transparent;border-radius:5px;margin:1px 0 4px;gap:1px}.item.sel{background:#314351;border-color:#506777}.item button:first-child{flex:1;min-width:0;text-align:left;background:none;border:0;font-size:13px;padding:5px 2px;overflow-wrap:anywhere}.verb{display:inline-block;min-width:46px;font:700 11px/1.6 var(--mono);letter-spacing:.25px;color:var(--amber)}.get,.good{color:var(--green)}.delete,.bad{color:#f0a9a4}.workspace{display:flex;flex-direction:column;gap:12px;min-width:0}.panel{overflow:hidden}.compose,.pad{padding:15px 18px}.pathline{color:var(--sub);font-size:12px;margin-bottom:3px}.endpoint{margin:12px 0 9px}.url{min-width:0;flex:1;display:flex;align-items:center;padding:4px 8px;background:#1f262d;border:1px solid #576571;border-radius:6px}.url input{border:0;background:transparent;font:14px var(--mono);width:100%;padding:5px 0}.send{min-width:88px;font-weight:650}.tools,.meta{color:var(--sub);font-size:12px;flex-wrap:wrap}.tools label{display:inline-flex;align-items:center;gap:5px}.tools input[type=text]{width:92px;padding:3px 5px}.tools input[type=checkbox]{accent-color:#90c5e9}.title{border-bottom:1px solid var(--line);padding:10px 16px;background:#30363d}.tabs{gap:17px;padding:0 16px;border-bottom:1px solid #414a52}.tabs button{border:0;background:none;border-radius:0;padding:7px 0;color:var(--sub);font-size:12px}.tabs .active{box-shadow:inset 0 -2px var(--sky);color:#fff}.editor{background:#20262c;min-height:100px;padding:14px 16px}.editor textarea,pre{display:block;width:100%;font:14px/1.7 var(--mono);background:transparent;border:0;color:#c4ddda;resize:vertical;overflow-wrap:anywhere;white-space:pre-wrap}.editor textarea{min-height:82px}.pill{font:600 12px/1.55 "Segoe UI",sans-serif;padding:2px 8px;border:1px solid #466258;border-radius:4px;color:#b8dec6;background:#304139}.foot{position:sticky;bottom:0;z-index:2;padding:6px 15px;min-height:44px;background:#282f35;border-top:1px solid var(--line);font-size:12px}.foot button{font-size:12px}.logarea{max-height:180px;overflow:auto;background:#20262c;padding:10px 16px}.logline{display:block;width:100%;font:13px/1.7 var(--mono);text-align:left;white-space:pre-wrap;border:0;background:none;color:#b6c9d4}.logline[aria-pressed=true]{color:#e6f6ff;background:#354752}.home-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.big{grid-column:span 3}.widget{grid-column:span 2}.cardhead{padding-bottom:15px}.listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #424a51;padding:10px 0;font-size:13px}.big .listrow{padding:13px 0}.cardbtn{width:100%;margin-top:9px}.date{color:var(--sub);font-size:13px;margin:2px 0 12px}.version{font-size:28px;font-weight:600;margin:10px 0}.widget h2,.big h2{font-size:16px}dialog{padding:0;width:min(520px,94vw);background:#292f35;color:#f2f4f6}dialog::backdrop{background:#11171ba8}.dialogbody{padding:16px 18px;max-height:70vh;overflow:auto}.formrow{display:grid;gap:5px;margin:8px 0}.formrow input,select{min-width:0}.dialogfoot{display:flex;justify-content:flex-end;gap:7px;border-top:1px solid var(--line);padding:11px 16px}.varrow{display:grid;grid-template-columns:1fr 1.2fr auto;gap:6px;margin:6px 0}.varrow input{min-width:0;width:100%}.danger{color:#f1aaa6}.note{color:var(--sub);font-size:12px;margin-top:8px}
@media(max-width:800px){#post{grid-template-columns:185px minmax(0,1fr)}.widget{grid-column:span 3}}@media(max-width:620px){#post{grid-template-columns:1fr}aside{max-height:210px;overflow:auto}.big,.widget{grid-column:1/-1}.endpoint{flex-wrap:wrap}.url{flex-basis:100%}.foot{flex-wrap:wrap}.foot .sub{display:none}.varrow{grid-template-columns:1fr}.meta{gap:3px}nav button{min-width:90px}}

<div class="row apart asidehead"><h2>저장한 요청</h2><button id="newGroup" class="ghost">＋ 그룹</button></div><div id="tree"></div></aside>

<section class="widget panel pad"><h2 class="cardhead">Node 작업</h2><div class="listrow">24.22.3<span class="pill">사용 중</span></div><div class="listrow">22.16.0<small>설치됨</small></div></section>

<dialog id="dialog"><div class="title"><h2 id="dialogTitle"></h2><button class="more auto" id="closeDialog" aria-label="닫기">×</button></div><div id="dialogBody" class="dialogbody"></div><div id="actions" class="dialogfoot"></div></dialog>
<script>
const $ = id => document.getElementById(id);
const group = (name,open=true) => ({name,open});
const loose = group('미분류');
let groups = [group('샘플 API'),group('장비 상태',false),loose];
function request(name,method,path,folder) {
  return {name,method,url:'${deviceUrl}'+path,folder,index:1n,body:method==='POST'?'{"name": "test_${index}"}':''};
}
let requests = [request('샘플 생성','POST','/api/samples',groups[0]),request('샘플 조회','GET','/api/samples',groups[0]),request('샘플 삭제','DELETE','/api/samples/42',groups[0]),request('상태 확인','GET','/health',groups[1])];
let current = requests[0], requestTab=0, responseHeaders=false;
const environments = new Map(['개발 장비','QA 장비'].map((name,i)=>[name,{
  vars:[['deviceUrl',i?'https://qa.example.test':'https://dev.example.test'],['site',i?'qa':'dev']],
  api:i?'https://qa.example.test':'https://dev.example.test',logged:i===0
}]));
const env = () => environments.get($('env').value);
// Example of a just-finished batch. Subsequent sends only produce local fixture results.
let run={name:'샘플 생성',env:'개발 장비',method:'POST',start:1n,count:3n,indexed:true,example:true};
let selected=3n,page=0n;
current.index=4n;
function node(tag,txt,cls) {
  const result=document.createElement(tag);
  if(txt!==undefined)result.textContent=txt;
  if(cls)result.className=cls;
  return result;
}
function button(label,action,cls) {
  const b=node('button',label,cls);
  b.onclick=action; return b;
}
function modal(title,save,actionLabel='저장') {
  $('dialogTitle').textContent=title;
  $('dialogBody').replaceChildren();$('actions').replaceChildren();
  $('actions').append(button('닫기',()=>$('dialog').close()));
  if(save)$('actions').append(button(actionLabel,save,'primary'));
  if(!$('dialog').open)$('dialog').showModal();
}
function field(label,value) {
  const l=node('label',label,'formrow'),input=node('input');
  input.value=value;l.append(input);$('dialogBody').append(l);return input;
}
function nonempty(input) {
  input.setCustomValidity(input.value.trim()?'':'이름을 입력해 주세요.');
  return input.reportValidity();
}
function groupEditor(g) {
  let input;
  modal(g?'그룹 수정':'그룹 추가',()=>{
    if(!nonempty(input))return;
    if(g)g.name=input.value.trim();else groups.splice(groups.length-1,0,group(input.value.trim()));
    $('dialog').close();tree();
  });
  input=field('그룹 이름',g?.name??'');
  if(g)$('dialogBody').append(button('그룹 삭제',()=>{
    modal('그룹 삭제',()=>{
      requests.filter(r=>r.folder===g).forEach(r=>r.folder=loose);loose.open=true;
      groups=groups.filter(item=>item!==g);$('dialog').close();draw();
    },'그룹 삭제');
    $('dialogBody').textContent='그룹의 요청은 미분류로 이동합니다.';
  },'danger'));
  input.focus();
}
function requestEditor(r) {
  let name,url,select;
  modal('저장한 요청 수정',()=>{
    if(!nonempty(name)||!nonempty(url))return;
    r.name=name.value.trim();r.url=url.value.trim();r.folder=groups[Number(select.value)];r.folder.open=true;
    $('dialog').close();draw();
  });
  name=field('요청 이름',r.name);url=field('URL',r.url);
  const label=node('label','그룹','formrow');select=node('select');select.setAttribute('aria-label','그룹');
  groups.forEach((g,i)=>{const o=node('option',g.name);o.value=i;o.selected=g===r.folder;select.append(o)});
  label.append(select);$('dialogBody').append(label,button('요청 삭제',()=>{
    modal('요청 삭제',()=>{
      requests=requests.filter(item=>item!==r);
      if(current===r)choose(requests[0]);else draw();
      $('dialog').close();
    },'요청 삭제');$('dialogBody').textContent='“'+r.name+'” 요청을 삭제할까요?';
  },'danger'));
}
function tree() {
  $('tree').replaceChildren();
  groups.forEach(g=>{
    if(g===loose&&!requests.some(r=>r.folder===g))return;
    const details=node('details',undefined,'folder');details.open=g.open;
    details.ontoggle=()=>g.open=details.open;
    const summary=node('summary',g.name);summary.append(node('small',String(requests.filter(r=>r.folder===g).length)));
    if(g!==loose){const more=button('···',e=>{e.preventDefault();groupEditor(g)},'more auto');more.setAttribute('aria-label',g.name+' 그룹 수정');summary.append(more)}
    details.append(summary);
    requests.filter(r=>r.folder===g).forEach(r=>{
      const item=node('div',undefined,'item'+(current===r?' sel':''));
      const chooseBtn=button('',()=>choose(r));chooseBtn.append(node('span',r.method,'verb '+r.method.toLowerCase()),document.createTextNode(r.name));
      const edit=button('···',()=>requestEditor(r),'more');edit.setAttribute('aria-label',r.name+' 요청 수정');
      item.append(chooseBtn,edit);details.append(item);
    });
    $('tree').append(details);
  });
  $('crumb').textContent=current?'저장한 요청　/　'+current.folder.name:'저장한 요청';
}
function choose(r) {
  current=r;requestTab=r?.method==='GET'?1:0;$('repeat').checked=false;draw();
}
function manage() {
  let rows;
  modal('환경 관리 · '+$('env').value,()=>{
    const entries=[...rows.children].map(row=>[...row.querySelectorAll('input')].map(i=>i.value.trim()));
    const names=entries.map(entry=>entry[0]);
    if(names.some(s=>!s||s==='index')||new Set(names).size!==names.length){message.textContent='각 변수에 서로 다른 이름을 입력하세요. index는 예약 이름입니다.';return}
    env().vars=entries;$('dialog').close();draw();
  });
  const head=node('div',undefined,'row apart');head.append(node('h3','변수'),button('＋ 변수 추가',()=>add('',''),'ghost'));
  rows=node('div');const message=node('p','','note');message.setAttribute('role','status');
  function add(key,val){
    const row=node('div',undefined,'varrow');const k=node('input'),v=node('input');
    k.placeholder='변수 이름';v.placeholder='값';k.setAttribute('aria-label','변수 이름');v.setAttribute('aria-label','변수 값');
    k.value=key;v.value=val;
    const remove=button('×',()=>row.remove(),'more');remove.setAttribute('aria-label','변수 삭제');
    row.append(k,v,remove);rows.append(row);return k;
  }
  env().vars.forEach(([k,v])=>add(k,v));$('dialogBody').append(head,rows,message,node('p','인증 · 토큰 수신 API　'+env().api,'note'));
}
function count() {
  if(current?.method!=='POST'||!$('repeat').checked)return 1n;
  const raw=$('count').value.trim();return /^\d+$/.test(raw)?BigInt(raw):0n;
}
function indexUsed(){return current?.method==='POST'&&current.body.includes('${index}')}
function range(){
  $('countControl').hidden=!current||current.method!=='POST'||!$('repeat').checked;
  const n=count();$('send').disabled=!current||n<1n;
  $('send').textContent=!$('countControl').hidden&&n>0n?n+'회 보내기':'보내기';
  $('range').textContent=!current?'':!n?'횟수는 양의 정수로 입력하세요.':indexUsed()?'인덱스 '+current.index+(n>1n?' – '+(current.index+n-1n):''):n>1n?'같은 요청을 반복합니다.':'';
}
function requestPane() {
  const panel=$('reqContent');panel.replaceChildren();
  [...$('reqTabs').children].forEach((b,i)=>{b.classList.toggle('active',i===requestTab);b.disabled=!current||(i===0&&current.method==='GET')});
  if(!current)return;
  if(requestTab===0){const t=node('textarea');t.setAttribute('aria-label','JSON 요청 본문');t.value=current.body;t.oninput=()=>{current.body=t.value;range()};panel.append(t)}
  if(requestTab===1)panel.append(node('pre','Accept: application/json'));
  if(requestTab===2)panel.append(node('p','환경 로그인 사용'),node('small','같은 환경·계정에서 발급받은 유효한 토큰을 헤더에 사용합니다.'));
}
function code(n) {
  if(run.example&&n===2n)return '409 Conflict';
  return run.method==='POST'?'201 Created':run.method==='GET'?'200 OK':'204 No Content';
}
function results() {
  const status=code(selected);
  $('responseOwner').textContent=run.env+'　/　'+run.name;
  $('status').textContent=status+'　·　'+selected+'회차';
  $('status').className='auto '+(status.startsWith('4')?'bad':'good');
  $('bodyTab').classList.toggle('active',!responseHeaders);$('hdrTab').classList.toggle('active',responseHeaders);
  const resultName='test_'+(run.start+selected-1n);
  const content=status.startsWith('4')?{message:'이미 등록된 샘플입니다.'}:run.method==='GET'?[{name:'sample'}]:run.indexed?{name:resultName,created:true}:{created:true};
  $('response').textContent=responseHeaders?(status.startsWith('204')?'응답 헤더 없음':'Content-Type: application/json'):status.startsWith('204')?'응답 본문 없음':JSON.stringify(content,null,2);
  const begin=page*5n+1n,end=begin+4n<run.count?begin+4n:run.count;
  $('pageNumber').textContent=begin+'–'+end+' / '+run.count;$('prev').disabled=page===0n;$('next').disabled=end===run.count;
  $('log').replaceChildren();
  for(let i=begin;i<=end;i++){
    const b=button(i+'회　 '+code(i)+(run.indexed?'　 test_'+(run.start+i-1n):''),()=>{selected=i;results()},'logline');
    b.setAttribute('aria-pressed',String(i===selected));$('log').append(b);
  }
  $('footStatus').textContent='실행 완료　·　'+run.count+'회'+(run.example?'　·　실패 1건':'');
  $('homeEnv').textContent=$('env').value;$('homeAuth').textContent=env().logged?'인증됨':'로그인 필요';
  $('homeLast').textContent=run.name;$('homeCode').textContent=run.env+' · '+(run.example?'2 성공 / 1 실패':code(run.count));
}
function draw(){
  tree();$('reqName').textContent=current?.name??'저장한 요청 없음';$('method').textContent=current?.method??'';
  $('method').className='verb '+(current?.method??'').toLowerCase();$('url').value=current?.url??'';$('url').disabled=!current;
  $('auth').textContent=$('env').value+'　·　'+(env().logged?'인증됨':'로그인 필요');
  $('repeatControl').hidden=current?.method!=='POST';range();requestPane();results();
}
function send(){
  if(!current||count()<1n)return;
  const expanded=current.url.replaceAll(/\$\{([^}]+)\}/g,(original,key)=>env().vars.find(([k])=>k===key)?.[1]??original);
  let ok=false;try{ok=new URL(expanded).origin===env().api&&!expanded.includes('${')}catch{}
  if(!ok){modal('요청 주소 확인');$('dialogBody').textContent='환경 변수와 토큰을 받을 API 주소를 확인하세요. 본 요청을 보내지 않았습니다.';return}
  // A change of environment never transfers the previous environment's login state.
  env().logged=true;run={name:current.name,env:$('env').value,method:current.method,count:count(),start:current.index,indexed:indexUsed(),example:false};
  if(run.indexed)current.index+=run.count;
  selected=run.count;page=(selected-1n)/5n;responseHeaders=false;draw();
}
function drawer(show){$('drawer').hidden=!show;$('toggleLog').setAttribute('aria-expanded',String(show));if(show)$('drawer').scrollIntoView({block:'nearest'})}
function showHome(home){
  $('home').hidden=!home;$('post').hidden=home;$('footer').hidden=home;$('postTab').classList.toggle('active',!home);$('homeTab').classList.toggle('active',home);window.scrollTo(0,0);
}
$('env').onchange=draw;$('newGroup').onclick=()=>groupEditor();$('manage').onclick=manage;$('closeDialog').onclick=()=>$('dialog').close();
$('url').oninput=e=>{if(current)current.url=e.target.value};$('repeat').onchange=range;$('count').oninput=range;$('send').onclick=send;
$('reqTabs').onclick=e=>{if(e.target.dataset.tab!==undefined){requestTab=Number(e.target.dataset.tab);requestPane()}};
$('bodyTab').onclick=()=>{responseHeaders=false;results()};$('hdrTab').onclick=()=>{responseHeaders=true;results()};
$('toggleLog').onclick=()=>drawer($('drawer').hidden);$('closeLog').onclick=()=>drawer(false);
$('prev').onclick=()=>{page--;results()};$('next').onclick=()=>{page++;results()};
$('homeTab').onclick=()=>showHome(true);$('postTab').onclick=$('openPost').onclick=()=>showHome(false);
draw();showHome(location.hash==='#home');
</script></html>
