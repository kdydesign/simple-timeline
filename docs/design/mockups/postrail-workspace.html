/* PostRail uses the available window height for the two editors. */
body{display:flex;flex-direction:column;min-height:100dvh}
header{flex:none}
#post{flex:1;width:100%;min-height:0;grid-template-columns:206px minmax(0,1fr)}
#post .workspace{gap:8px}
#post aside{padding:10px 8px;font-size:12px}
#post .env{padding:4px 7px;margin:4px 0 10px}
#post .asidehead{padding-top:9px;margin-bottom:3px}
#post h2{font-size:13px}
#post .folder summary{font-size:12px;padding:5px 2px}
#post .item button:first-child{font-size:12px}
#post .compose{padding:8px 12px}
#post .request-heading{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#post .pathline{font-size:11px;margin:0}
#post h1{font-size:15px}
#post .endpoint{gap:6px;margin:5px 0}
#post .url{padding:2px 8px}
#post .send{min-width:63px;font-size:12px;padding:5px 8px}
#post .tools,#post .tools label{font-size:11px}
.code-pane{flex:1 1 0;display:flex;flex-direction:column;min-height:164px}
.pane-bar{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:0 10px;min-height:33px}
.pane-bar .tabs{padding:0;border:0;gap:12px}
.pane-bar .tabs button{font-size:11px;padding:6px 0}
.pane-bar small,.pane-bar #status{font-size:11px}
.code-pane .editor{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;padding:12px 14px}
.code-pane .editor textarea{flex:1;min-height:90px;resize:none;padding:0}
.code-pane .editor textarea,.code-pane pre,#url{font:14px/1.65 var(--mono)}
.code-pane small{display:block}
#home{width:100%;margin:0 auto}
.star{background:none;border-color:transparent;font-size:16px;line-height:1;padding:3px;color:var(--sub)}
.star[aria-pressed=true]{color:#e6bd7e}
.favorite-row{display:flex;align-items:center;gap:6px;min-height:32px;border-bottom:1px solid #424a51;font-size:13px}
.favorite-row .verb{min-width:43px}
.favorite-row button{margin-left:auto;padding:2px 7px;font-size:12px}
.favorite-row .repeat-home{margin-left:0;color:var(--sky);background:transparent;border-color:var(--line);font-size:11px}
#favorites{min-width:0}
.home-result{margin-top:8px;font-size:12px;color:var(--sub)}
/* Match the PlanRail status shell and its dark glass theme. */
.foot{flex:none;display:flex;align-items:center;flex-wrap:nowrap;gap:10px;min-height:39px;padding:4px 14px;border-top:1px solid var(--rim);background:var(--glass);color:var(--muted);font-size:12px;--rim:#b4bfc449;--glass:rgba(43,46,49,.5);--muted:#c0c5cb}
.foot button{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:inherit;color:inherit;padding:2px 3px;border:0;background:transparent}
.foot button:hover,.foot button[aria-expanded=true]{color:var(--sky)}
.foot svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#footStatus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:621px){body:has(#post:not([hidden])){height:100dvh}#post{overflow:auto}}
@media(max-width:620px){#post{grid-template-columns:1fr}.code-pane{min-height:195px}.pane-bar{flex-wrap:wrap;gap:4px 9px}.foot{margin-top:auto}}
@media(max-width:510px){.foot{gap:6px}}

/* Expanded content and the status strip belong to the same footer. */
#footer{position:sticky;bottom:0;z-index:2;flex:none}
#footer .foot{position:static}
#drawer{background:#292f34;border-top:1px solid #b4bfc449;color:#c0c5cb}
.drawer-head{display:flex;align-items:center;flex-wrap:wrap;gap:4px 9px;padding:4px 14px;font-size:12px}
.drawer-head h2{font-size:13px}

#footer #toggleLog svg{transition:transform .15s}

body:has(#post:not([hidden])){height:100dvh}
#post{overflow:auto}
.workrail-widget-meta{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 8px;padding-top:6px;border-top:1px solid #b4bfc430;color:#c0c5cb;font-size:11px}
.workrail-link{width:fit-content;justify-self:end;margin:0;padding:0 1px;border:0;background:transparent;color:inherit;font-size:inherit;text-align:start}
.workrail-link:hover:enabled{background:transparent;color:#f1f2f3;text-decoration:underline}
.json-key{color:#9cdafa}.json-string{color:#badaaa}.json-number{color:#ffc285}
.json-boolean{color:#d6b1fa}.json-null{color:#95cecb}.json-variable{color:#ffd875}
.json-input{position:relative;overflow:hidden;flex:1;min-height:90px}
.code-pane .json-input pre,.code-pane .json-input textarea{margin:0;padding:0;border:0;tab-size:4;font-variant-ligatures:none;white-space:pre;overflow-wrap:normal}
.json-input pre{position:absolute;top:0;left:0;width:max-content;pointer-events:none;user-select:none}
.code-pane .json-input textarea{position:absolute;inset:0;width:100%;height:100%;min-height:0;overflow:auto;color:transparent;caret-color:#f1f2f3;background:transparent}
.json-input textarea::selection{background:#6489af80}
@media(forced-colors:active){.json-input pre{display:none}.code-pane .json-input textarea{color:CanvasText;caret-color:CanvasText}}
/* The same glass, field dimensions and action spacing as the WorkRail standard dialog. */
#dialog{width:min(460px,calc(100vw - 28px));max-height:calc(100dvh - 32px);overflow:auto;padding:20px 22px;border:1px solid #b4bfc449;border-radius:14px;background:rgba(43,46,49,.5);backdrop-filter:blur(28px);box-shadow:0 14px 42px #0007}

#dialog .formrow{font-size:13px;font-weight:600;margin:0 0 14px}

#dialog input,#dialog select{height:36px;padding:6px 10px;border-radius:8px;background:#6e73784d;border:1px solid #b4bfc449;color:inherit}
#dialog option,#method option{background:#292f35;color:#eef2f5}
#dialog button,#newRequest{min-height:32px;padding:5px 11px;font-size:13px;border-radius:8px;color:inherit;border:1px solid #b4bfc449;background:linear-gradient(155deg,#ffffff18,transparent 65%),#6e73784d;box-shadow:0 1px 2px #0003,inset 0 1px 0 #ffffff20}
#dialog .dialogfoot{gap:8px;padding:12px 0 0;border-top:1px solid #b4bfc430}
#dialog .primary{background:linear-gradient(155deg,#5796cd55,#24507840 65%),#477fae4d;border-color:#8bc1eb}
#dialog .danger{color:#ffc1ba}
#dialog .leading{margin-right:auto}
#newRequest{min-height:24px;padding:0 7px;font-size:16px}
#method{flex:none;width:78px;padding:3px 4px;background:#30383f;border-color:var(--line)}
#contextMenu{position:fixed;z-index:20;min-width:125px;padding:3px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:5px;background:#2b2e31;box-shadow:0 8px 24px #0005}
#contextMenu button{display:block;width:100%;padding:4px 7px;font-size:12px;text-align:left;background:none;border:0}
#contextMenu button:hover,#contextMenu button:focus{background:#b4c8dc26}
</style>

<script>
const $ = id => document.getElementById(id);
const group = (name,open=true) => ({name,open});
const loose = group('미분류');
let groups = [group('샘플 API'),group('장비 상태',false),loose];
function request(name,method,path,folder) {
  return {name,method,url:'${deviceUrl}'+path,folder,index:1n,body:method==='POST'?JSON.stringify({name:'test_${index}',site:'${site}',priority:2,enabled:true,note:null},null,2):''};
}
let requests = [request('샘플 생성','POST','/api/samples',groups[0]),request('샘플 조회','GET','/api/samples',groups[0]),request('샘플 삭제','DELETE','/api/samples/42',groups[0]),request('상태 확인','GET','/health',groups[1]),request('장비 목록','GET','/devices',groups[1]),request('연결 점검','GET','/ready',groups[1]),request('장비 버전','GET','/version',groups[1])];

const menu=$('contextMenu');
let menuAnchor;
function dismissMenu(restore=false){
  if(menu.hidden)return;
  menu.hidden=true;menuAnchor.setAttribute('aria-expanded','false');
  if(restore)menuAnchor.focus();
}
function menuButton(label,entries,classes='more'){
  const trigger=button('…',event=>{
    event.preventDefault();
    if(!menu.hidden&&menuAnchor===trigger){dismissMenu(true);return}
    dismissMenu();menuAnchor=trigger;
    menu.replaceChildren(...entries.map(([title,action])=>{
      const opt=button(title,()=>{dismissMenu(true);action()});opt.setAttribute('role','menuitem');return opt;
    }));
    menu.hidden=false;trigger.setAttribute('aria-expanded','true');
    const rect=trigger.getBoundingClientRect();
    menu.style.left=Math.max(0,Math.min(rect.left,innerWidth-menu.offsetWidth))+'px';
    menu.style.top=(rect.bottom+menu.offsetHeight<=innerHeight?rect.bottom:Math.max(0,rect.top-menu.offsetHeight))+'px';
    menu.firstElementChild.focus();
  },classes);
  trigger.setAttribute('aria-label',label);trigger.setAttribute('aria-haspopup','menu');trigger.setAttribute('aria-expanded','false');
  return trigger;
}
document.addEventListener('pointerdown',event=>{
  if(!menu.hidden&&!menu.contains(event.target)&&!menuAnchor.contains(event.target))dismissMenu();
});
menu.onfocusout=e=>{if(e.relatedTarget&&!menu.contains(e.relatedTarget))dismissMenu()};
menu.onkeydown=e=>{
  const items=[...menu.children],i=items.indexOf(document.activeElement);
  if(e.key==='Escape'){e.preventDefault();dismissMenu(true);return}
  const jumps={ArrowDown:(i+1)%items.length,ArrowUp:(i+items.length-1)%items.length,Home:0,End:items.length-1};
  if(Object.hasOwn(jumps,e.key)){e.preventDefault();items[jumps[e.key]].focus()}
};

// Keep the original text nodes so copy, escapes and indentation survive highlighting.
function paintJson(host, source, templateValues=false) {
  if(source.length>65536){host.textContent=source;return}
  const fragment=document.createDocumentFragment();
  const tokens=/"(?:\\[^\n]|[^"\\\n])*"?|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|\b(?:true|false|null)\b/g;
  let end=0;
  for(const match of source.matchAll(tokens)){
    const token=match[0];
    fragment.append(source.slice(end,match.index));
    end=match.index+token.length;
    if(token.startsWith('"')){
      const key=/^\s*:/.test(source.slice(end))&&token.endsWith('"');
      const span=node('span',undefined,key?'json-key':'json-string');
      if(templateValues&&!key){
        let pos=0;
        for(const variable of token.matchAll(/\$\{[^{}"\s]+\}/g)){
          span.append(token.slice(pos,variable.index),node('span',variable[0],'json-variable'));
          pos=variable.index+variable[0].length;
        }
        span.append(token.slice(pos));
      }else span.textContent=token;
      fragment.append(span);
    }else{
      const kind=token==='null'?'null':token==='true'||token==='false'?'boolean':'number';
      fragment.append(node('span',token,'json-'+kind));
    }
  }
  fragment.append(source.slice(end));host.replaceChildren(fragment);
}
function requestBodyEditor(){

}

function code(n) {

function results() {
  const status=code(selected);
  $('responseOwner').textContent=run.env+'　/　'+run.name;
  $('status').textContent=status+'　·　'+selected+'회차';
  $('status').className='auto '+(status.startsWith('4')?'bad':'good');
  $('bodyTab').classList.toggle('active',!responseHeaders);$('hdrTab').classList.toggle('active',responseHeaders);
  const resultName='test_'+(run.start+selected-1n);
  const content=status.startsWith('4')?{message:'이미 등록된 샘플입니다.'}:run.method==='GET'?[{name:'sample'}]:run.indexed?{name:resultName,created:true,count:1,note:null}:{created:true};

  if(responseHeaders)$('response').textContent=empty?'응답 헤더 없음':'Content-Type: '+(run.plain?'text/plain':'application/json');
  else if(empty||run.plain)$('response').textContent=empty?'응답 본문 없음':'OK';

function sendRequest(r,n,input=r){
  if(!r||n<1n)return;
  const expanded=input.url.replaceAll(/\$\{([^}]+)\}/g,(original,key)=>env().vars.find(([k])=>k===key)?.[1]??original);
  let ok=false;try{ok=new URL(expanded).origin===env().api&&!expanded.includes('${')}catch{}
  if(!ok){modal('요청 주소 확인');$('dialogBody').textContent='환경 변수와 토큰을 받을 API 주소를 확인하세요. 본 요청을 보내지 않았습니다.';return}
  // A change of environment never transfers the previous environment's login state.
  env().logged=true;run={name:r.name,env:$('env').value,method:input.method,count:n,plain:input.method==='GET'&&new URL(expanded).pathname==='/health',start:r.index,indexed:indexUsed(input,input.body),example:false};
  if(run.indexed)r.index+=run.count;
  selected=run.count;$('iteration').value=selected;$('iteration').setCustomValidity('');page=(selected-1n)/logPageSize;responseHeaders=false;draw();
}

};
