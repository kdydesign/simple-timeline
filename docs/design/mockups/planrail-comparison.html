<style>

verflow:auto;flex:1;min-height:0}.g-head{height:62px;display:flex;position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line)}.name-head{width:252px;flex-shrink:0;border-right:1px solid var(--line);display:flex;align-items:center;padding:0 20px;font-size:12px;font-weight:600;color:var(--muted);position:sticky;left:0;background:var(--surface);z-index:2}.axis{min-width:1176px;flex:1}.months{height:30px;display:flex;align-items:center;font-size:11px;color:var(--muted)}.months span{padding-left:10px;border-right:1px solid var(--line);height:30px;display:flex;align-items:center}.days{height:32px;display:flex}.days button{width:28px;border-right:1px solid var(--line);border-radius:0!important;padding:0;font-size:11px;flex-shrink:0}.days button.selected{background:var(--selected);color:var(--accent);font-weight:700}.g-row{display:flex;min-height:52px;border-bottom:1px solid var(--line)}.g-row.schedule{height:60px;min-height:60px}.g-row.project{height:64px;background:var(--soft)}.g-name{width:252px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 16px;border-right:1px solid var(--line);position:sticky;left:0;background:var(--surface);z-index:2}.project .g-name{background:var(--soft)}.g-name>button{padding:0;text-align:left;min-width:0;border-radius:3px;flex:1}.g-name strong,.g-name small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.g-name strong{font-weight:500;font-size:13px;line-height:20px}.project strong{font-weight:650}.g-name small{font-size:12px;color:var(--muted);margin-top:4px;line-height:18px}.g-name .chev{width:14px;height:14px;flex:none;padding:0}.g-name .add{flex:none;width:24px;height:28px;text-align:center}.schedule .g-name{padding-left:40px}.dot{display:inline-block;width:8px;height:8px;border-radius:3px;flex-shrink:0;background:var(--project,#6366f1)}.track{position:relative;min-width:1176px;flex:1;background:repeating-linear-gradient(to right,transparent 0,transparent 27px,var( </style></head><body>
<div class="review"><div><strong>Planrail 디자인 비교</strong><small>디자인 전용 시안 · 예시 데이터 · 제품 저장 및 창 조작 없음</small></div><span class="note">간트·달력, 테마, 프로젝트 목록, 편집 패널을 눌러 비교하세요.</span><nav><button data-concept="a">A · Zinc</button><button data-concept="b">B · Mist</button></nav></div><div id="root"></div>
<script>
const params=new URLSearchParams(location.search);let concept=params.get('concept')||'a',theme=params.get('theme')||'light',mode=params.get('mode')||'gantt',editorOpen=params.has('editor'),projectsOpen=false,popup='',selected=5,projectIndex=0,projectCount=4;
const paths={gantt:'M3 6h10M7 12h14M3 18h12',calendar:'M3 8h18M8 3v4m8-4v4M4 5h16v16H4Z M8 12h2m4 0h2M8 16h2m4 0h2',folder:'M3 7V4h7l3 3h8v13H3Z',project:'M3 7V4h7l3 3h8v13H3Z M12 11v6m-3-3h6',plus:'M12 5v14M5 12h14',left:'m14 6-6 6 6 6',right:'m10 6 6 6-6 6',down:'m6 9 6 6 6-6',close:'m6 6 12 12M6 18 18 6',min:'M5 12h14',max:'M5 5h14v14H5Z',moon:'M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z',sun:'M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',today:'M12 2v3m0 14v3M2 12h3m14 0h3M18 12a6 6 0 1 1-12 0 6 6 0 0 1 12 0',check:'m5 12 4 4L19 6'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]}"/></svg>`;
const button=(n,label,action,cls='',tip=false)=>`<button class="ib ${cls}" aria-label="${label}" data-action="${action}" ${tip?`data-tip="${label}"`:''}>${icon(n)}</button>`;
const projects=[{name:'1.1.1 핫픽스',people:'민수 · 지수',color:'#6366f1',schedules:[['요구사항 정리',2,7],['개발',6,18],['QA',19,24],['운영 배포',25,25]]},{name:'홈페이지 개편',people:'서연 · 민수',color:'#0d9488',schedules:[['화면 설계',5,13],['퍼블리싱',12,22]]},{name:'운영 개선',people:'지수',color:'#d97706',schedules:[['사용자 피드백 정리',9,16]]},{name:'신규 프로젝트',people:'참여자 없음',color:'#64748b',schedules:[]}];
const day=(n)=>new Date(Date.UTC(2026,10,n)).toISOString().slice(0,10);
function gantt(){return `<div class="timeline"><div class="g-head"><div class="name-head">프로젝트 / 일정</div><div class="axis"><div class="months"><span style="width:728px">2026년 11월</span><span style="width:448px">2026년 12월</span></div><div class="days">${Array.from({length:42},(_,i)=>`<button class="${i+5===selected?'selected':''}" aria-label="${day(i+5)} 일정 추가" data-action="day-${i+5}">${Number(day(i+5).slice(8))}</button>`).join('')}</div></div></div>${projects.map((p,pi)=>`<div class="g-row project" style="--project:${p.color}"><div class="g-name"><button class="chev" aria-label="${p.name} 접기" data-action="collapse-${pi}">${icon('down')}</button><span class="dot"></span><button data-action="edit-${pi}"><strong>${p.name}</strong><small>${p.people}${!p.schedules.length?'　일정 없음':''}</small></button><button class="add" aria-label="${p.name} 일정 추가" data-action="edit-${pi}">${icon('plus')}</button></div><div class="track" style="--selected-left:${(selected-5)*28}px"></div></div>${p.schedules.map((s,si)=>`<div class="g-row schedule" data-project="${pi}" style="--project:${p.color}"><div class="g-name"><span class="dot"></span><button data-action="edit-${pi}"><strong>${s[0]}</strong><small>11.${String(s[1]).padStart(2,'0')} — 11.${String(s[2]).padStart(2,'0')}</small></button></div><div class="track" style="--selected-left:${(selected-5)*28}px"><button class="g-bar" data-action="edit-${pi}" style="left:${Math.max(0,s[1]-5)*28}px;width:${(s[2]-Math.max(5,s[1])+1)*28-3}px">${s[0]}</button></div></div>`).join('')}`).join('')}</div>`}
function calendar(){const cells=Array.from({length:42},(_,i)=>i-5);return `<div class="calendar"><div class="weekdays">${['월','화','수','목','금','토','일'].map(d=>`<span>${d}</span>`).join('')}</div>${Array.from({length:6},(_,w)=>{const week=cells.slice(w*7,w*7+7);let lanes=[];projects.forEach((p,pi)=>p.schedules.forEach(s=>{if(s[1]<=week[6]&&s[2]>=week[0])lanes.push({p,pi,s})}));return `<div class="week">${week.map(d=>`<button class="day ${d<1||d>30?'adjacent':''} ${d===5?'today':''} ${d===selected?'selected':''}" aria-label="${day(d)} 일정 추가" data-action="day-${d}"><span>${Number(day(d).slice(8))}</span></button>`).join('')}${lanes.slice(0,3).map(({p,pi,s},lane)=>{const a=Math.max(week[0],s[1]),b=Math.min(week[6],s[2]);return `<button class="cal-bar" data-action="edit-${pi}" style="--project:${p.color};left:calc(${(a-week[0])*100/7}% + 4px);width:calc(${(b-a+1)*100/7}% - 8px);top:${43+lane*28}px">${s[1]<week[0]?'‹ ':''}${s[0]}${s[2]>week[6]?' ›':''}</button>`}).join('')}</div>`}).join('')}</div>`}
function editor(){return `<aside class="editor"><div class="editor-head"><h2>일정 추가</h2>${button('close','편집 닫기','close-editor')}</div><div class="field"><label for="schedule-name">일정 이름</label><input id="schedule-name" value="${projects[projectIndex].schedules[0]?.[0]||'새 일정'}"></div><div class="field"><label>소속 프로젝트</label><button class="select" data-action="project-select" aria-label="소속 프로젝트"><span class="dot" style="--project:${projects[projectIndex].color}"></span>${projects[projectIndex].name}${icon('down')}</button></div><div class="field"><label for="date-start">시작일</label><input id="date-start" value="2026-11-05" data-action="start-date" readonly></div><div class="field"><label for="date-end">종료일</label><input id="date-end" value="2026-11-13" data-action="end-date" readonly></div><p class="hint">YYYY-MM-DD · 시작일과 종료일을 모두 포함합니다.</p><div class="period">기간 9일</div><div class="editor-footer"><button data-action="close-editor">취소</button><button class="primary" data-action="close-editor">저장</button></div></aside>`}
function projectPopup(){return `<div class="project-popup" role="region" aria-label="프로젝트 목록"><div class="popup-head"><strong>프로젝트 목록</strong>${button('close','목록 닫기','projects')}</div><div class="project-list">${Array.from({length:projectCount},(_,i)=>{const p=projects[i%4];return `<button class="project-item" data-action="edit-${i%4}"><span class="dot" style="--project:${p.color}"></span><span class="names"><strong>${i<4?p.name:`프로젝트 ${i+1}`}</strong><small>${p.people} · 일정 ${p.schedules.length}개</small></span>${icon('plus')}</button>`}).join('')}</div><div class="popup-foot"><button data-action="new-project">프로젝트 추가</button></div></div>`}
function picker(){return `<div class="floating picker" role="group" aria-label="날짜 선택"><div class="picker-nav">${button('left','달력 이전 달','noop')}<strong>2026년 11월</strong>${button('right','달력 다음 달','noop')}</div><div class="picker-grid">${['월','화','수','목','금','토','일'].map(x=>`<span>${x}</span>`).join('')}${Array.from({length:42},(_,i)=>{const d=i-5;return `<button data-action="pick-${d}" class="${d===selected?'selected':''} ${d===5?'today':''} ${d<1||d>30?'faded':''}">${Number(day(d).slice(8))}</button>`}).join('')}</div></div>`}
function render(){document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.concept===concept));document.getElementById('root').innerHTML=`<div class="app ${concept} ${theme}"><div class="titlebar"><div class="brand"><span class="brand-mark">${icon('gantt')}</span>Planrail</div><div class="window">${button('min','최소화','noop')}${button('max','최대화','noop')}${button('close','트레이로 숨기기','noop','quit')}</div></div><header class="toolbar">${button('folder','프로젝트 목록','projects',projectsOpen?'active':'',true)}<h1>${mode==='gantt'?'전체 일정':'월간 달력'}</h1><span class="spacer"></span><nav class="mode">${button('gantt','간트','gantt',mode==='gantt'?'active':'',true)}${button('calendar','달력','calendar',mode==='calendar'?'active':'',true)}</nav><span class="separator"></span><div class="date-nav">${button('left','이전 달','noop')}<input aria-label="조회 날짜" data-action="nav-date" value="${day(selected)}" readonly>${button('right','다음 달','noop')}</div>${button('today','오늘','today','',true)}<span class="separator"></span><div class="actions">${button(theme==='light'?'moon':'sun',theme==='light'?'다크 모드':'라이트 모드','theme','',true)}${button('project','프로젝트 추가','new-project','',true)}${button('plus','일정 추가','edit-0','primary',true)}</div></header><div class="workspace"><main class="main"><div class="info"><span>${mode==='gantt'?'2026-11-01 — 2026-12-31':'2026년 11월'}</span><span class="right">${mode==='gantt'?'Ctrl + 휠 확대·축소　 Space + 드래그 이동':'월요일 시작 · 최대 3줄'}</span></div>${mode==='gantt'?gantt():calendar()}<div class="foot">${mode==='gantt'?'<span>100%</span><div class="rail"><span></span></div>':'<span>프로젝트 4개 · 일정 7개</span>'}</div></main>${editorOpen?editor():''}</div>${projectsOpen?projectPopup():''}${popup==='project-select'?`<div class="floating choices" role="listbox" aria-label="소속 프로젝트">${projects.map((p,i)=>`<button class="${i===projectIndex?'active':''}" data-action="choose-${i}"><span class="dot" style="--project:${p.color}"></span>${p.name}${i===projectIndex?icon('check'):''}</button>`).join('')}</div>`:popup?picker():''}</div>`;positionPopup()}
function positionPopup(){if(!popup)return;const selector=popup==='nav-date'?'[aria-label="조회 날짜"]':popup==='project-select'?'[aria-label="소속 프로젝트"]':popup==='end-date'?'#date-end':'#date-start';const a=document.querySelector(selector)?.getBoundingClientRect(),el=document.querySelector('.floating');if(a&&el){const h=el.getBoundingClientRect().height;el.style.left=Math.max(8,Math.min(a.left,innerWidth-294))+'px';el.style.top=(innerHeight-a.bottom>h+12?a.bottom+7:Math.max(8,a.top-h-7))+'px'}}
document.addEventListener('click',e=>{const choice=e.target.closest('[data-concept]');if(choice){concept=choice.dataset.concept;popup='';render();return}const el=e.target.closest('[data-action]');if(!el){if(popup||projectsOpen){popup='';projectsOpen=false;render()}return}const a=el.dataset.action;if(a==='noop')return;if(a==='gantt'||a==='calendar'){mode=a;popup=''}else if(a==='theme')theme=theme==='light'?'dark':'light';else if(a==='projects'){projectsOpen=!projectsOpen;popup=''}else if(a==='close-editor'){editorOpen=false;popup=''}else if(['nav-date','start-date','end-date','project-select'].includes(a)){popup=popup===a?'':a;projectsOpen=false}else if(a.startsWith('choose-')){projectIndex=+a.split('-')[1];popup=''}else if(a.startsWith('pick-')){const d=Number(a.slice(5));if(popup==='nav-date')selected=d;popup=''}else if(a.startsWith('day-')){selected=Number(a.slice(4));editorOpen=true;popup=''}else if(a.startsWith('edit-')){projectIndex=+a.split('-')[1];editorOpen=true;projectsOpen=false;popup=''}else if(a==='today'){selected=5;popup=''}else if(a.startsWith('collapse-')){const rows=document.querySelectorAll(`[data-project="${a.split('-')[1]}"]`);rows.forEach(r=>r.style.display=r.style.display==='none'?'flex':'none');return}else if(a==='new-project'){editorOpen=true;projectsOpen=false;popup=''}render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){popup='';projectsOpen=false;render()}});window.addEventListener('resize',positionPopup);
let tipTimer;function hideTip(){clearTimeout(tipTimer);document.querySelector('.tip')?.remove()}function showTip(b){hideTip();if(!b?.dataset.tip)return;tipTimer=setTimeout(()=>{const el=document.createElement('div');el.className='tip';el.role='tooltip';el.textContent=b.dataset.tip;document.querySelector('.app').append(el);const a=b.getBoundingClientRect(),r=el.getBoundingClientRect();el.style.left=Math.max(8,Math.min(a.left+a.width/2-r.width/2,innerWidth-r.width-8))+'px';el.style.top=a.bottom+8+'px'},250)}document.addEventListener('pointerover',e=>showTip(e.target.closest('[data-tip]')));document.addEventListener('pointerout',hideTip);document.addEventListener('focusin',e=>showTip(e.target.closest('[data-tip]')));document.addEventListener('focusout',hideTip);document.addEventListener('pointerdown',hideTip);document.addEventListener('scroll',hideTip,true);
window.previewState=s=>{concept=s.concept??concept;mode=s.mode??mode;theme=s.theme??theme;editorOpen=s.editor??editorOpen;projectsOpen=s.projects??projectsOpen;popup=s.popup??popup;projectCount=s.projectCount??projectCount;selected=s.selected??selected;hideTip();render()};render();
</script></body></html>
