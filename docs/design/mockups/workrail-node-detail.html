<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WorkRail · NodeRail과 Home 시안</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:linear-gradient(124deg,#232b31,#252731 72%,#332d40);min-height:100vh;color:#edf1f4;font:14px/1.5 'Segoe UI','Noto Sans CJK KR',sans-serif}main{max-width:1260px;margin:auto;padding:28px}header,nav,.row,.pair,.head,.wrap,.item,.key{display:flex;align-items:center;gap:9px}header{justify-content:space-between;border-bottom:1px solid #ffffff25;padding-bottom:16px;margin-bottom:18px}header strong{font-size:20px}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #ffffff38;background:#ffffff0c;border-radius:6px;padding:5px 10px;font-size:12px}button[aria-current],.selected{background:#304859;border-color:#7fb8de}button:focus-visible,input:focus-visible{outline:2px solid #97d6ff;outline-offset:2px}h1{font-size:22px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{min-width:0;background:#1e252bc2;border:1px solid #ffffff27;border-radius:11px;padding:18px}h2{font-size:15px;font-weight:640;margin:0 0 14px}.caption{color:#b4bdc4;margin:14px 0 0;font-size:13px}.surface{background:linear-gradient(122deg,#313b424a,#ffffff04),#272b30;border:1px solid #596169;border-radius:9px;padding:15px;position:relative;overflow:hidden}.head{gap:12px;min-height:100px}.identity{min-width:0}.wrap{flex-wrap:wrap;gap:6px}.label{font-weight:600;color:#d1d8de}.badge,.due{font-size:11px;display:inline-block;padding:2px 6px;border-radius:4px;color:#cee2ef;border:1px solid #66829877;background:#7194ae18;white-space:nowrap}.manager{color:#b8dfc6;border-color:#698f7655;background:#78b78d13}.node{flex:none;width:24px;height:24px;color:#92c7e7;transform:translateY(-3px)}.version{line-height:1.45;font-family:inherit;font-size:27px;font-weight:650;font-variant-numeric:tabular-nums}.head button{margin-left:auto;white-space:nowrap}.track{position:absolute;inset:0 0 auto;height:2px;background:#7da1bb22}.track:after{content:'';display:block;height:100%;width:32%;margin-left:28%;background:#9bd7fa}.compact .head{display:grid;grid-template-columns:22px 1fr auto;align-items:center}.compact .wrap{flex-wrap:nowrap}.compact .version{font-size:23px}.compact .identity{display:contents}.compact .wrap{grid-column:2/4}.compact .version{grid-column:2}.compact .node{align-self:start}.ribbon .head{flex-wrap:wrap;column-gap:10px}.ribbon .identity{display:contents}.ribbon .wrap{width:calc(100% - 39px);border-bottom:1px solid #ffffff15;padding-bottom:7px}.ribbon .version{margin-left:34px}.seg .badge{margin:0;border-radius:0}.seg .pair{gap:0}.seg .badge:first-child{border-radius:5px 0 0 5px}.seg .badge:last-child{border-radius:0 5px 5px 0}.seg .head{border-left:3px solid #628499}.field{display:flex;align-items:center;gap:8px;color:#c9d9e3;border:1px solid #9ab3c44f;background:#b0d5ed0c;border-radius:6px;min-height:34px;padding:3px 10px;flex:1;min-width:100px}.field:focus-within{outline:2px solid #86c6ed}.field input{background:none;border:0;outline:0;min-width:0;width:100%;font-size:13px}.field input::placeholder{color:#bdc8d0}.sB .field{border-radius:30px;background:linear-gradient(100deg,#7cade326,#a2c8e508)}.sC .field{border:0;border-bottom:2px solid #7faac1;border-radius:3px 3px 0 0;background:#ffffff05}.sD .field{background:linear-gradient(#afc7d017,#91a8be06);box-shadow:inset 0 1px #d6efff44}.glass{background:linear-gradient(112deg,#34404c,#282d32 65%,#363344)}.item{justify-content:space-between;padding:10px 0;border-top:1px solid #ffffff18}.detail{font-size:12px;color:#b7c1c9}.share{color:#e6b49f;background:#9e67472c;border:1px solid #a27e6466;padding:1px 5px;border-radius:4px;font-size:11px}.due.now{color:#eed6a6;background:#d3a95312;border-color:#bc9b5059}.actionbox{position:relative}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#13212baf;backdrop-filter:blur(2px);border-radius:inherit}.overlay span{color:#c1cbd4;font-size:12px}.pulse{width:23px;height:23px;border:2px solid #ffffff38;border-top-color:#a0d5f7;border-radius:50%;margin:0 auto 7px}.demo[hidden],section[hidden]{display:none}.minor{color:#9caebd;font-size:12px}.row svg{width:15px;height:15px}.homegrid{align-items:start}.homegrid article{max-width:530px;width:100%}.homegrid article:nth-child(-n+2){max-width:396px}.homegrid button{margin-left:auto}.sides{margin-left:auto}.row{flex-wrap:wrap}.head .wrap{font-size:13px}
@media(max-width:950px){.grid{grid-template-columns:1fr}.head .wrap{flex-wrap:wrap}}@media(prefers-reduced-motion:no-preference){.anim .track:after{animation:go 1.1s linear infinite}.anim .pulse{animation:spin 1s linear infinite}@keyframes go{from{transform:translateX(-200%)}to{transform:translateX(240%)}}@keyframes spin{to{transform:rotate(360deg)}}}
</style><main><header><strong>WorkRail</strong><nav aria-label="시안"><button data-view="panel">현재 사용 버전</button><button data-view="search">버전 검색</button><button data-view="home">Home</button></nav></header><section id="panel"><h1>현재 사용 버전 패널</h1><div class="grid"></div></section><section id="search"><h1>공식 배포 목록 검색</h1><div class="grid"></div></section><section id="home"><h1>Home</h1><div class="grid homegrid"></div></section></main>
<script>
const node='<svg class="node" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8.7 5v10L12 22l-8.7-5V7z M9 15.5v-7l6 7v-7"/></svg>';
const badge='<span class="pair"><span class="badge">Windows</span><span class="badge manager">NVM 1.1.11 설치</span></span>';
const panel=(name,cls,description)=>'<article class="'+cls+'"><h2>'+name+'</h2><div class="surface head"><i class="track"></i>'+node+'<div class="identity"><div class="wrap"><span class="label">현재 사용 버전</span>'+badge+'</div><div class="version">24.22.3</div></div><button class="check">⟳ 다시 검사</button></div><p class="caption">'+description+'</p></article>';
document.querySelector('#panel .grid').innerHTML=[['A · 기본형','','제목과 두 배지를 한 줄에 두고 버전을 바로 아래에 둡니다.'],['B · 밀집형','compact','첫 줄을 배지에 쓰고, 버전과 검사 버튼을 둘째 줄에 맞춥니다.'],['C · 두 단 구분형','ribbon','얇은 구분선으로 환경 정보와 버전·동작을 나눕니다.'],['D · 연결 배지형','seg','환경과 관리자를 붙여 한 쌍으로 읽게 합니다.']].map(x=>panel(...x)).join('');
const mag='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg>';
const field=(a,title,d)=>'<article class="s'+a+'"><h2>'+a+' · '+title+'</h2><div class="surface glass"><h2>공식 배포 목록</h2><div class="row"><label class="field">'+mag+'<input type="search" aria-label="버전 검색 '+a+'" placeholder="버전 검색"></label><span class="badge selected">전체</span><span class="badge">LTS</span></div><div class="item detail"><span>Node 버전</span><span>분류</span></div><div class="item sample"><strong>24.22.3</strong><span class="badge manager">LTS · Krypton</span></div></div><p class="caption">'+d+'</p></article>';
document.querySelector('#search .grid').innerHTML=[['A','얇은 테두리','중성 반투명 면에 얇은 테두리를 주고 포커스만 파란색으로 강조합니다.'],['B','캡슐형','둥근 윤곽과 옅은 청색으로 필터 버튼과 검색을 구분합니다.'],['C','밑줄형','바탕을 가장 투명하게 두고 하단 선으로 입력 위치를 표시합니다.'],['D','상단 반사형','직선형 입력 칸 위에 한 줄 하이라이트를 더합니다.']].map(x=>field(...x)).join('');
const ver='<div class="item"><strong>24.22.3</strong><span class="badge manager">사용 중</span></div><div class="item"><strong>24.22.2</strong><button class="use">사용</button></div>';
const widget=(active)=>'<article><h2>'+ (active?'전환 중':'전환 전')+'</h2><div class="surface actionbox"><h2>Node 작업</h2><div class="under">'+ver+'</div><div class="overlay demo" '+(active?'':'hidden')+' role="status"><i class="pulse"></i><strong>24.22.2 사용</strong><span>Windows 권한 확인 또는 작업 완료 대기 중</span></div></div></article>';
const schedule=(n,pr,date,share,due)=>'<div class="item"><div><b>'+n+'</b><div class="detail">'+pr+' · '+date+'</div></div><div class="row"><span class="'+(share?'share':'badge')+'">'+(share?'공유':'개인')+'</span><span class="due '+(due==='오늘 마감'?'now':'')+'">'+due+'</span></div></div>';
document.querySelector('#home .grid').innerHTML=widget(false)+widget(true)+'<article><h2>11월 19일 목요일</h2><div class="surface"><h2>오늘의 일정</h2>'+schedule('결제 화면 검수','웹 리뉴얼','11.17 – 11.19',true,'오늘 마감')+schedule('인수 테스트','팀 도구','11.18 – 11.20',false,'1일 남음')+schedule('릴리스 준비','팀 도구','11.19 – 11.23',true,'4일 남음')+'</div></article><article><h2>관리자 폴더</h2><div class="surface"><div class="row"><b>내 개발 환경</b><button aria-label="관리자 폴더 열기" title="관리자 폴더 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h7l2 3h9v10H3z"/></svg></button></div><p class="detail">Windows · 현재 사용 중인 Node</p><div class="version">24.22.3</div>'+badge+'</div></article>';
function show(v){if(!['panel','search','home'].includes(v))v='panel';document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==v);document.querySelectorAll('[data-view]').forEach(b=>b.toggleAttribute('aria-current',b.dataset.view===v));history.replaceState(null,'','#'+v)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));show(location.hash.slice(1));document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{let c=b.closest('.head');c.classList.add('anim');b.disabled=true;setTimeout(()=>{c.classList.remove('anim');c.querySelector('.track').hidden=true;b.disabled=false},1800);c.querySelector('.track').hidden=false});document.querySelectorAll('input').forEach(i=>i.oninput=()=>i.closest('article').querySelector('.sample').style.display=('24.22.3 lts krypton'.includes(i.value.toLowerCase())?'flex':'none'));document.querySelectorAll('.actionbox').forEach(box=>{let under=box.querySelector('.under'),o=box.querySelector('.overlay');under.inert=!o.hidden;box.querySelector('.use').onclick=()=>{under.inert=true;o.hidden=false;setTimeout(()=>{under.inert=false;o.hidden=true},2500)}});
</script></html>
