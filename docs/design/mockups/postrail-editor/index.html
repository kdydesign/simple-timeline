function readQuery(url) {
  const raw = url.split('?').slice(1).join('?');
  if (!raw) return [];
  return raw.split('&').filter(Boolean).map(segment => {
    const [key, value] = new URLSearchParams(segment).entries().next().value;
    return {key, value, segment, enabled:true};
  });
}

function setQueryUrl(request, url) {
  const previous = request.params || [];
  const disabled = previous.map((param, slot) => ({param, slot})).filter(entry => !entry.param.enabled);
  request.url = url;
  request.params = readQuery(url);
  for (const {param, slot} of disabled) {
    request.params.splice(Math.min(slot, request.params.length), 0, param);
  }
}

function encodeQueryTemplate(text) {
  return text.split(/(\$\{[^{}]+\})/).map((part, index) => index % 2 ? part : encodeURIComponent(part)).join('');
}

function writeQuery(request) {
  const path = request.url.split('?')[0];
  const search = request.params.filter(p => p.enabled && p.key).map(p => p.segment).join('&');
  request.url = path + (search ? '?' + search : '');
  $('#url').innerHTML = vars(request.url);
}

function pathParts(request) {
  return request.url.split('?')[0].split('/');
}

function pathName(part) {
  return /^:([A-Za-z_]\w*)$/.exec(part)?.[1];
}

function pathNames(request) {
  return [...new Set(pathParts(request).map(pathName).filter(Boolean))];

    const name = pathName(part);
    return name && request.pathValues?.[name] ? encodeQueryTemplate(request.pathValues[name]) : part;
  }).join('/');
}

function headerList(raw) {
  const rows = [], names = new Set();
  for (const [i, line] of raw.split(/\r?\n/).entries()) {
    if (!line.trim()) continue;
    const colon = line.indexOf(':');
    const key = line.slice(0, colon).trim();
    if (colon < 1 || !/^[!#$%&'*+.^_`|~\w-]+$/.test(key) || names.has(key.toLowerCase())) {
      return {error:(i + 1) + '행의 헤더 이름·콜론 또는 중복 이름을 확인하세요.'};
    }
    names.add(key.toLowerCase());
    rows.push({key, value:line.slice(colon + 1).trim(), enabled:true});
  }
  return {rows};
}

// Validate the grammar, then change only whitespace between the original tokens.
function indentJson(text) {
  JSON.parse(text);
  const tokens = text.match(/"(?:\\[\s\S]|[^"\\])*"|[^\s"{}\[\],:]+|[{}\[\],:]/g);
  let depth = 0, previous = '', formatted = '';
  const newline = () => '\n' + '  '.repeat(depth);
  for (const token of tokens) {
    const closing = token === '}' || token === ']';
    const afterOpen = previous === '{' || previous === '[';
    if (closing) depth--;
    if ((closing && !afterOpen) || (!closing && (afterOpen || previous === ','))) formatted += newline();
    if (previous === ':') formatted += ' ';
    formatted += token;
    if (token === '{' || token === '[') depth++;
    previous = token;
  }
  return formatted;
}

function findInBody(move = 0) {
  const body = $('#response'), term = $('#bodySearch').value;
  const marks = CSS.highlights;
  marks.delete('hits');marks.delete('current-hit');
  const hits = [];
  if (format === 'body' && payload !== null && term) {
    const rx = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'giu');
    const nodes = [], walker = document.createTreeWalker(body,NodeFilter.SHOW_TEXT);
    let n, length = 0;
    while ((n = walker.nextNode())) {nodes.push({n,start:length});length += n.length}
    let first = 0, last = 0;
    for (const match of body.textContent.matchAll(rx)) {
      const from = match.index, to = from + match[0].length;
      while (first+1 < nodes.length && nodes[first+1].start <= from) first++;
      last = Math.max(last,first);
      while (last+1 < nodes.length && nodes[last+1].start < to) last++;
      const range = new Range();
      range.setStart(nodes[first].n,from-nodes[first].start);
      range.setEnd(nodes[last].n,to-nodes[last].start);
      hits.push(range);
    }
  }
  activeHit = hits.length ? (Math.min(activeHit,hits.length-1)+move+hits.length)%hits.length : 0;
  $('#hitCount').textContent = term ? (hits.length ? (activeHit+1)+'/'+hits.length : '0건') : '';
  if (hits.length) {
    const highlight = new Highlight();
    for (const range of hits) highlight.add(range);
    marks.set('hits',highlight);
    const current = new Highlight(hits[activeHit]);current.priority=1;
    marks.set('current-hit',current);
    const pane = body.closest('.viewport'), bounds = pane.getBoundingClientRect(), match = hits[activeHit].getBoundingClientRect();
    if (match.top<bounds.top || match.bottom>bounds.bottom) pane.scrollTop += match.top-bounds.top-5;
    if (match.left<bounds.left || match.right>bounds.right) pane.scrollLeft += match.left-bounds.left-5;
  }
}

  const missing = pathNames(r).find(name => !r.pathValues?.[name]);
  if (missing) return ':' + missing + ' 경로 값을 입력하세요.';
  if (r.m !== 'POST') return '';
  if (r.bodyType === 'multipart') {
    const mime = r.head.match(/^content-type:[ \t]*(.*)$/im)?.[1]?.trim();
    if (mime && mime.toLowerCase() !== 'multipart/form-data') return 'multipart의 Content-Type은 자동값을 사용하거나 raw로 전환하세요.';
    if (r.parts?.some(part => part.enabled && part.type === 'File' && !part.filename)) return '사용할 파일을 선택하세요.';
  }
  if (r.bodyType === 'binary' && !r.binary?.filename) return '본문으로 전송할 파일을 선택하세요.';
  return '';
}

function exampleResponse(r) {
  const path = pathPreview(r);
  if (path.endsWith('/products/search')) {
    const params = new URLSearchParams(r.url.split('?')[1]);
    return {products:[{id:1,title:'예시 상품'}],limit:Number(params.get('limit') || 30)};
  }
  if (r.m === 'GET' && /\/products\/\d+$/.test(path)) return {id:Number(path.split('/').at(-1)),title:'예시 상품'};
  return {id:1,title:'예시 상품'};
}
