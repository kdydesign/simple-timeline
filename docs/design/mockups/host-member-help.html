const topics=[
{group:'시작하기',title:'호스트와 멤버 이해하기',text:'호스트는 공유 원본을 관리하고 멤버는 허용된 프로젝트를 조회합니다. 개인 프로젝트는 각 PC에서 계속 관리합니다.',steps:['대표 PC에서 호스트로 공유를 선택합니다.','다른 PC는 멤버로 연결합니다.','멤버는 공유 원본을 수정하지 않으며 자기 일정 알림을 설정할 수 있습니다.']},
{group:'호스트 사용법',title:'공유 시작하기',text:'트레이의 연결 상태를 눌러 공유 설정을 엽니다. 다른 PC에서 접근할 수 있는 호스트의 실제 LAN IPv4를 선택하세요.',steps:['LAN IP와 포트를 확인하고 호스트 주소 저장을 누릅니다.','공유 시작을 누릅니다.','호스트가 완전히 종료되거나 절전 상태이면 공유가 중단됩니다.']},
{group:'호스트 사용법',title:'참여자 등록과 승인',text:'공유할 PC의 이름과 IP를 등록한 뒤 연결을 승인합니다. 등록만으로 프로젝트가 자동 공유되지는 않습니다.',special:true},
{group:'호스트 사용법',title:'프로젝트 공유하기',text:'프로젝트 편집에서 공유 프로젝트로 저장을 켜고 참여자와 승인 PC를 연결합니다.',steps:['공유할 원본 프로젝트를 엽니다.','참여자와 승인 PC를 연결하고 저장합니다.','개인 원본은 공유 프로젝트로 전환되며 별도 개인 복사본은 남지 않습니다.']},
{group:'호스트 사용법',title:'업데이트 배포하기',text:'호스트는 먼저 직접 업데이트하고 동일 정식 버전의 업데이트 ZIP을 등록합니다.',steps:['공유 설정에서 업데이트 ZIP을 선택하고 검사를 마칩니다.','버전과 파일 정보를 확인한 뒤 배포 시작을 누릅니다.','멤버는 새 버전 확인 후 UPDATE 버튼으로 설치를 진행합니다.']},
{group:'멤버 사용법',title:'호스트 연결하기',text:'호스트에게 받은 주소와 포트를 입력하고 양쪽 화면의 전체 지문을 비교합니다.',steps:['멤버로 연결에서 호스트 주소를 입력합니다.','양쪽의 전체64자리 지문을 비교하고 호스트의 승인과 멤버의 확인을 마칩니다.','자신에게 공유된 프로젝트만 수신합니다.']},
{group:'멤버 사용법',title:'동기화와 연결 상태',text:'간트/달력 왼쪽의 수동 동기화로 최신 자료를 확인합니다. 제목 옆 연결 상태에서 정상 확인 여부를 볼 수 있습니다.',steps:['호스트가 공유 중인지 확인합니다.','수동 동기화를 누르고 정상 반영을 확인합니다.','연결이 끊기면 마지막 수신본은 조회할 수 있지만 최신 자료는 아닐 수 있습니다.']},
{group:'멤버 사용법',title:'알림과 업데이트',text:'자신의 일정 알림과 공유 변경 알림은 별도 설정입니다. 새 버전이 있으면 제목 옆 UPDATE가 나타납니다.',steps:['일정 편집에서 자신의 날짜 알림을 설정합니다.','UPDATE를 눌러 내려받고 검증합니다.','미저장 입력 때문에 설치가 대기하면 입력을 정리한 뒤 설치 후 재시작을 누릅니다.']},
{group:'문제 해결',title:'연결이 되지 않을 때',text:'호스트 공유 시작 여부, 주소·포트, 등록 IP와 승인 상태를 순서대로 확인하세요.',steps:['127.0.0.1 대신 실제 호스트 LAN IPv4를 사용합니다.','호스트가 절전·종료·공유 중지 상태인지 확인합니다.','회사 방화벽 정책은 IT 담당자에게 확인합니다. 방화벽 전체를 끄지 않습니다.']}
];
const main=document.querySelector('main'), nav=document.querySelector('nav'), search=document.querySelector('#search'), dialog=document.querySelector('dialog');let current=2,zoom=1;
function menu(){const q=search.value.trim().toLocaleLowerCase();document.querySelector('#clear').hidden=!q;nav.replaceChildren();let group='';let matches=0;topics.forEach((t,i)=>{if(q&&!JSON.stringify([t.title,t.text,t.steps||[],t.special?'이름 IP 등록 승인 취소 삭제':'']).toLocaleLowerCase().includes(q))return;matches++;if(group!==t.group){group=t.group;const h=document.createElement('div');h.className='group';h.textContent=group;nav.append(h)}const b=document.createElement('button');b.textContent=t.title;b.dataset.topic=i;if(i===current)b.setAttribute('aria-current','page');b.onclick=()=>show(i);nav.append(b)});if(!matches){const p=document.createElement('p');p.className='empty';p.textContent='검색 결과가 없습니다. 다른 검색어를 입력하세요.';nav.append(p)}}
function show(i){current=i;const t=topics[i];main.innerHTML=`<div class="breadcrumb">${t.group}</div><h1>${t.title}</h1><p class="lead">${t.text}</p>`+(t.special?`<div class="figure"><button class="image-button" aria-label="참여자 화면 크게 보기">${capture}</button><span class="pin p1">1</span><span class="pin p2">2</span></div><div class="imagehint"><span>격리 테스트 화면의 참여자 영역 · 예시 데이터</span><span>클릭하여 확대 ↗</span></div><ol class="steps"><li><div><strong>등록된 PC와 승인 상태 확인</strong><p>‘승인 대기’는 등록은 되었지만 연결 승인이 끝나지 않은 상태입니다.<br>승인 취소는 등록을 남기고 접근을 막으며, 휴지통은 등록과 공유 권한을 제거합니다.</p></div></li><li><div><strong>이름과 실제 멤버 IP를 입력하고 등록</strong><p>192.168.0.20은 예시입니다. 해당 멤버 PC의 실제 IPv4를 입력하세요.</p></div></li></ol><div class="note">이후 멤버가 호스트에 연결하면 양쪽의 전체64자리 지문을 대조하고 승인합니다.<br>다음 단계에서 프로젝트 참여자와 승인 PC를 연결하세요.</div>`:`<ol class="steps">${t.steps.map(s=>`<li><div><p>${s}</p></div></li>`).join('')}</ol><div class="note">검토용 요약입니다. 출시 도움말에는 해당 버전의 실제 화면과 단계별 설명을 함께 제공합니다.</div>`);main.scrollTop=0;menu();document.querySelector('.image-button')?.addEventListener('click',()=>{document.querySelector('.zoomview').innerHTML=capture;zoom=1;applyZoom();dialog.showModal()})}
function applyZoom(){const svg=document.querySelector('.zoomview svg');if(svg){svg.style.width=zoom*100+'%';svg.style.minWidth='0'}document.querySelector('#scale').textContent=zoom===1?'화면 맞춤':Math.round(zoom*100)+'%'}
function setZoom(v){zoom=Math.max(.5,Math.min(3,v));applyZoom()}
search.oninput=menu;document.querySelector('#clear').onclick=()=>{search.value='';menu();search.focus()};document.querySelector('.help-trigger').onclick=()=>main.focus();document.querySelector('.close').onclick=()=>dialog.close();document.querySelector('#plus').onclick=()=>setZoom(zoom+.25);document.querySelector('#minus').onclick=()=>setZoom(zoom-.25);document.querySelector('#fit').onclick=()=>setZoom(1);const view=document.querySelector('.zoomview');view.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom+(e.deltaY<0?.1:-.1))},{passive:false});let drag=null;view.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,left:view.scrollLeft,top:view.scrollTop};view.setPointerCapture(e.pointerId)};view.onpointermove=e=>{if(drag){view.scrollLeft=drag.left+drag.x-e.clientX;view.scrollTop=drag.top+drag.y-e.clientY}};view.onpointerup=view.onpointercancel=()=>drag=null;show(2);
</script></html>
