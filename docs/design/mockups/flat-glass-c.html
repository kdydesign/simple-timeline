const icons={"grid": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"/><path d=\"M3 10h18M8 2v4m8-4v4M9 10v11m6-11v11\"/>", "gantt": "<path d=\"M3 6h10M7 12h14M3 18h12\"/>", "folder": "<path d=\"M3 7V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11H3Z\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>", "projectadd": "<path d=\"M3 7V5h7l3 3h7v12H3Z M12 11v6m-3-3h6\"/>", "chevron": "<path d=\"m9 5 7 7-7 7\"/>", "left": "<path d=\"m15 5-7 7 7 7\"/>", "down": "<path d=\"m6 9 6 6 6-6\"/>", "moon": "<path d=\"M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z\"/>", "sun": "<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1\"/>", "close": "<path d=\"m6 6 12 12M6 18 18 6\"/>", "min": "<path d=\"M5 12h14\"/>", "max": "<rect x=\"5\" y=\"5\" width=\"14\" height=\"14\" rx=\"1\"/>", "sidebar": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M9 4v16\"/>", "edit": "<path d=\"m5 15 11-11 4 4L9 19l-5 1Z M14 6l4 4\"/>", "check": "<path d=\"m5 12 4 4L19 6\"/>", "today": "<circle cx=\"12\" cy=\"12\" r=\"6\"/><path d=\"M12 2v3m0 14v3M2 12h3m14 0h3\"/>"};const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icons[n]}</svg>`;
const concept='c';
let mode='gantt',theme='light',projectsOpen=true,editorOpen=false,popup='',project=0,dateValue='2026-11-04';
const ps=[{name:'1.1.1 핫픽스',people:'민수 · 지수',color:'#376ce4',soft:'#e4edfc',ink:'#2857b4',count:3},{name:'고객 포털',people:'서연 · 준호',color:'#438c83',soft:'#e1f0ed',ink:'#256d64',count:2},{name:'운영 개선',people:'민수',color:'#a67b40',soft:'#f4ecdf',ink:'#86602b',count:2},{name:'다음 프로젝트',people:'참여자 없음',color:'#8796a8',soft:'#eef1f5',ink:'#66788c',count:0}];
// Synthetic overflow fixture for design review only; never connected to product data.
const previewCount=Number(new URLSearchParams(location.search).get('projects'));
if(Number.isInteger(previewCount)&&previewCount>ps.length&&previewCount<=100){while(ps.length<previewCount){const n=ps.length+1;ps.push({name:`프로젝트 ${String(n).padStart(2,'0')}`,people:'참여자 없음',color:'#8796a8',soft:'#eef1f5',ink:'#66788c',count:0})}}
const ss=[{name:'개발',p:0,start:4,end:14},{name:'QA',p:0,start:12,end:19},{name:'운영 배포',p:0,start:20,end:20},{name:'화면 검토',p:1,start:3,end:7},{name:'구현',p:1,start:9,end:18},{name:'점검',p:2,start:5,end:10},{name:'배포',p:2,start:16,end:18}];
const colors=p=>`--p:${p.color};--bar:${theme==='dark'?p.color+'35':p.soft};--bar-ink:${theme==='dark'?'#e4ecf5':p.ink}`;
const btn=(i,tip,act,cls='')=>`<button class="ib ${cls}" aria-label="${tip}" data-tip="${tip}" data-action="${act}">${icon(i)}</button>`;
function projects(){return `<div class="side-head">프로젝트 목록 ${concept==='d'?btn('projectadd','프로젝트 추가','new-project'):btn('close','목록 닫기','projects')}</div><div class="project-scroll" tabindex="0" role="region" aria-label="프로젝트 목록 스크롤">`+ps.map((p,i)=>`<div class="project-item ${i===project?'selected':''}"><span class="dot" style="--p:${p.color}"></span><button class="project-main" aria-label="${p.name} 편집" data-action="edit-project-${i}" data-tip="${p.name} 편집"><strong>${p.name}</strong><small>${p.people} · ${p.count}개</small></button>${btn('plus',p.name+'에 일정 추가','add-'+i)}</div>`).join('')+`</div><div class="side-foot">${btn('projectadd','프로젝트 추가','new-project')}<span>프로젝트 추가</span></div>`}
function picker(){return `<div class="popup picker"><div class="picker-nav">${btn('left','달력 이전 달','noop')}<input aria-label="달력 연도" value="2026"><button data-action="picker-month" data-tip="달력 월 선택">11월 ${icon('down')}</button>${btn('chevron','달력 다음 달','noop')}</div><div class="picker-days">${['월','화','수','목','금','토','일'].map(d=>`<span>${d}</span>`).join('')}${Array.from({length:6},()=>'<span></span>').join('')}${Array.from({length:30},(_,i)=>`<button class="${i+1===4?'chosen':''}" data-tip="2026-11-${String(i+1).padStart(2,'0')}" data-action="date-${i+1}">${i+1}</button>`).join('')}</div></div>`}
function editor(){return `<aside class="editor"><div class="editor-head"><h2>${window.projectEditor?'프로젝트 편집':'일정 추가'}</h2>${btn('close','편집 닫기','close-editor')}</div><div class="field"><label>${window.projectEditor?'프로젝트 이름':'일정 이름'}</label><input class="input" aria-label="${window.projectEditor?'프로젝트 이름':'일정 이름'}" value="${window.projectEditor?ps[project].name:'화면 검토'}"></div>${window.projectEditor?`<div class="field"><label>참여자</label><input class="input" value="${ps[project].people}" aria-label="참여자"></div><div class="field"><label>색상</label><input class="input" value="${ps[project].color}" aria-label="색상 코드"></div>`:`<div class="field"><label>소속 프로젝트</label><button class="select-button" aria-label="소속 프로젝트" data-action="project-select" data-tip="소속 프로젝트 선택"><span class="dot" style="--p:${ps[project].color}"></span>${ps[project].name}${icon('down')}</button>${popup==='project'?`<div class="popup">${ps.map((p,i)=>`<button class="option ${i===project?'chosen':''}" data-action="choose-${i}" data-tip="${p.name} 선택"><span class="dot" style="--p:${p.color}"></span>${p.name}${i===project?icon('check'):''}</button>`).join('')}</div>`:''}</div><div class="field"><label>시작일</label><div class="date-field"><input class="input" aria-label="시작일" value="${dateValue}">${btn('grid','시작일 달력 열기','date-picker')}</div>${popup==='date'?picker():''}</div><div class="field"><label>종료일</label><div class="date-field"><input class="input" aria-label="종료일" value="2026-11-07">${btn('grid','종료일 달력 열기','date-picker')}</div></div><p class="help">YYYY-MM-DD · 시작일과 종료일을 모두 포함합니다.</p>`}<div class="form-actions"><button class="text-btn primary" data-tip="변경 저장" data-action="close-editor">저장</button><button class="text-btn" data-tip="편집 취소" data-action="close-editor">취소</button></div></aside>`}
const cells=()=>Array.from({length:21},(_,i)=>`<div class="track-cell ${i+2===4?'today':''}" data-action="new-date-${i+2}"></div>`).join('');
function gantt(){let rows='';ps.forEach((p,i)=>{rows+=`<div class="g-row project" style="${colors(p)}"><div class="g-label">${btn('down','프로젝트 접기','collapse-'+i)}<span class="dot" style="--p:${p.color}"></span><div class="name-block"><button class="name-button" data-action="edit-project-${i}" data-tip="${p.name} 편집">${p.name}</button><small>${p.people}${!p.count?'　일정 없음':''}</small></div>${btn('plus','이 프로젝트에 일정 추가','add-'+i)}</div><div class="track">${cells()}</div></div>`;ss.filter(s=>s.p===i).forEach(s=>{rows+=`<div class="g-row schedule" data-project="${i}"><div class="g-label"><div class="name-block"><button class="name-button" data-action="edit-schedule" data-tip="${s.name} 편집">${s.name}</button><small>11/${String(s.start).padStart(2,'0')} — 11/${String(s.end).padStart(2,'0')}</small></div></div><div class="track">${cells()}<button class="bar" data-action="edit-schedule" data-tip="${s.name} · 11/${s.start}–11/${s.end}" style="${colors(p)};left:${(s.start-2)/21*100}%;width:${(s.end-s.start+1)/21*100}%">${s.name}</button></div></div>`})});return `<div class="gantt ${concept==='d'?'integrated':''}"><div class="g-head"><div class="g-label">프로젝트 / 일정<span class="spacer"></span>${concept==='d'?btn('projectadd','프로젝트 추가','new-project'):''}</div><div class="dates-head"><div class="months-label">2026년 11월</div><div class="ticks">${Array.from({length:21},(_,i)=>`<div class="tick ${i+2===4?'today':''}" data-action="new-date-${i+2}">${i+2}</div>`).join('')}</div></div></div>${rows}<div class="filler"><div class="g-label"></div><div class="track">${cells()}</div></div></div>`}
function calendar(){let weeks='';for(let w=0;w<6;w++){let cs='';for(let d=0;d<7;d++){const day=w*7+d-5;const n=day<1?day+31:day>30?day-30:day;cs+=`<div class="cell ${day<1||day>30?'out':''} ${day===4?'today':''}" data-action="new-date-${Math.max(1,Math.min(30,day))}"><span class="date-number">${n}</span></div>`}let bars='';const laneEnds=[-99,-99,-99];ss.filter(s=>s.start<=w*7+1&&s.end>=w*7-5).sort((a,b)=>a.start-b.start).forEach(s=>{let start=Math.max(s.start,w*7-5),end=Math.min(s.end,w*7+1);const i=laneEnds.findIndex(e=>e<start);if(i<0)return;laneEnds[i]=end;bars+=`<button class="cal-bar" data-action="edit-schedule" data-tip="${s.name} 편집" style="${colors(ps[s.p])};left:calc(${(start-(w*7-5))/7*100}% + 4px);width:calc(${(end-start+1)/7*100}% - 8px);top:${40+i*28}px">${s.start<start?'‹ ':''}${s.name}${s.end>end?' ›':''}</button>`});weeks+=`<div class="week"><div class="cells">${cs}</div>${bars}</div>`}return `<div class="calendar-layout">${concept==='d'?`<aside class="calendar-projects">${projects()}</aside>`:''}<div class="calendar"><div class="weekdays">${['월','화','수','목','금','토','일'].map(d=>`<span>${d}</span>`).join('')}</div>${weeks}</div></div>`}
function render(){document.body.className=`concept-${concept} ${theme==='dark'?'dark':''}`;document.querySelector('#app').innerHTML=`<div class="app"><div class="titlebar"><div class="brand"><span class="mark">${icon('gantt')}</span>Simple Timeline</div><div class="window-controls">${btn('min','최소화','noop')}${btn('max','최대화 / 복원','noop')}${btn('close','닫기','noop','close')}</div></div><div class="workspace">${concept==='a'&&projectsOpen?`<aside class="sidebar">${projects()}</aside>`:''}${concept==='b'?`<aside class="rail">${btn('folder','프로젝트 목록','projects',projectsOpen?'active':'')}${btn('projectadd','프로젝트 추가','new-project')}<span class="bottom">${btn(theme==='light'?'moon':'sun','테마 전환','theme')}</span></aside>`:''}<main class="main"><div class="toolbar">${concept==='a'?btn('sidebar',projectsOpen?'프로젝트 목록 접기':'프로젝트 목록 펼치기','projects'):''}${concept==='c'?btn('folder','프로젝트 목록','projects',projectsOpen?'active':''):''}<div class="heading-block"><h1>${mode==='gantt'?'전체 일정':'월간 달력'}</h1></div><span class="spacer"></span><div class="segmented">${btn('gantt','간트','gantt',mode==='gantt'?'active':'')}${btn('grid','달력','calendar',mode==='calendar'?'active':'')}</div><span class="divider"></span><div class="month">${btn('left','이전 달','noop')}<button class="month-label" data-action="month" data-tip="조회 연월 선택">2026. 11 ${icon('down')}</button>${btn('chevron','다음 달','noop')}${popup==='month'?`<div class="popup month-popup"><div class="picker-nav"><input value="2026" aria-label="조회 연도"></div><div class="month-grid">${Array.from({length:12},(_,i)=>`<button data-action="close-popup" data-tip="${i+1}월 선택">${i+1}월</button>`).join('')}</div></div>`:''}</div>${btn('today','오늘로 이동','today')}<span class="divider"></span>${concept!=='b'?btn(theme==='light'?'moon':'sun',theme==='light'?'다크 모드':'라이트 모드','theme'):''}${concept!=='d'?btn('projectadd','프로젝트 추가','new-project'):''}${btn('plus','일정 추가','add-0','primary-icon')}${concept==='c'&&projectsOpen?`<div class="floating-projects">${projects()}</div>`:''}</div><div class="view">${mode==='gantt'?gantt():calendar()}</div><div class="range-footer"><span>${mode==='gantt'?'2026-11-01 — 2026-11-30':'월요일 시작 · 최대 3줄'}</span>${mode==='gantt'?'<div class="scroll-track"><div class="scroll-thumb"></div></div>':''}</div></main>${editorOpen?editor():''}</div>${concept==='b'&&projectsOpen?`<aside class="drawer">${projects()}</aside>`:''}</div>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='noop')return;if(a==='gantt'||a==='calendar'){mode=a;popup=''}else if(a==='theme')theme=theme==='light'?'dark':'light';else if(a==='projects')projectsOpen=!projectsOpen;else if(a==='close-editor'){editorOpen=false;popup=''}else if(a==='project-select')popup=popup==='project'?'':'project';else if(a==='date-picker')popup=popup==='date'?'':'date';else if(a==='month'||a==='picker-month')popup=popup==='month'?'':'month';else if(a==='close-popup')popup='';else if(a.startsWith('choose-')){project=+a.split('-')[1];popup=''}else if(a.startsWith('date-')){dateValue=`2026-11-${String(a.split('-')[1]).padStart(2,'0')}`;popup=''}else if(a.startsWith('collapse-')){document.querySelectorAll(`[data-project="${a.split('-')[1]}"]`).forEach(e=>e.hidden=!e.hidden);return}else if(a==='today'){document.querySelector('.today')?.scrollIntoView({block:'nearest'});return}else{editorOpen=true;popup='';window.projectEditor=a.startsWith('edit-project')||a==='new-project';if(a.startsWith('edit-project'))project=+a.split('-')[2];if(a.startsWith('add-'))project=+a.split('-')[1];if(a.startsWith('new-date-'))dateValue=`2026-11-${String(a.split('-')[2]).padStart(2,'0')}`}render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){popup='';render()}});
const tooltip=document.createElement('div');tooltip.className='preview-tip';tooltip.id='preview-tooltip';tooltip.role='tooltip';tooltip.hidden=true;document.body.append(tooltip);
function showTip(button){const text=button?.dataset.tip;if(!text)return;tooltip.textContent=text;tooltip.hidden=false;const b=button.getBoundingClientRect(),t=tooltip.getBoundingClientRect();tooltip.style.left=Math.max(8,Math.min(innerWidth-t.width-8,b.left+b.width/2-t.width/2))+'px';tooltip.style.top=(b.bottom+t.height+10<innerHeight?b.bottom+7:b.top-t.height-7)+'px';button.setAttribute('aria-describedby',tooltip.id)}
document.addEventListener('pointerover',e=>{const b=e.target.closest('button[data-tip]');if(b)showTip(b)});document.addEventListener('pointerout',e=>{if(!e.target.closest('button[data-tip]')?.contains(e.relatedTarget))tooltip.hidden=true});document.addEventListener('focusin',e=>showTip(e.target.closest('button[data-tip]')));document.addEventListener('focusout',()=>tooltip.hidden=true);document.addEventListener('scroll',()=>tooltip.hidden=true,true);document.addEventListener('click',()=>tooltip.hidden=true);
window.previewState=(state)=>{if('mode'in state)mode=state.mode;if('theme'in state)theme=state.theme;if('projects'in state)projectsOpen=state.projects;if('editor'in state)editorOpen=state.editor;if('popup'in state)popup=state.popup;window.projectEditor=false;render()};render();
</script></body></html>
